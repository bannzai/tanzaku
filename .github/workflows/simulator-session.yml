# GitHub Actions の macOS ランナーで iOS Simulator と WebDriverAgent を起動し、iOS アプリを
# メンテナーの tailnet へ公開する。ローカル Mac で Simulator を起動せずに画面を確認するため。
# 処理の本体は simtunnel の reusable workflow (https://github.com/bannzai/simtunnel 、
# PROJECT.md「各アプリ repo での実行（reusable workflow）」)。使い方: AGENTS.md「画面の確認」。
name: simulator-session
# local/simtunnel はこの名前で run を探す (session=<name> で始まる必要がある)。
run-name: "session=${{ inputs.session }} device=${{ inputs.device }}"

on:
  # fork からの pull request に Tailscale の Secrets を渡さないため、手動 dispatch だけにする。
  workflow_dispatch:
    # local/simtunnel は session / device / duration_minutes を常に送り、未宣言の input を含む dispatch は拒否される。
    inputs:
      session:
        description: "セッション名。ランナーは simtunnel-<session> として tailnet に参加する (小文字英数字とハイフン)"
        required: true
        # tailnet のホスト名になるため、別リポジトリのセッションと衝突しないようリポジトリ名を接頭辞にする (AGENTS.md「画面の確認」)。
        default: tanzaku-ios
      device:
        description: "Simulator のデバイス名 (iPad は例えば iPad Pro 11-inch (M5))"
        required: true
        # simtunnel の session.yml の既定と同じデバイスにそろえる。
        default: iPhone 17
      duration_minutes:
        description: "セッションを維持する分数"
        required: true
        # simtunnel の既定と同じ。1 回の画面の確認 (ライト・ダークの撮影) に足り、macOS ランナーを CI と共有するため長くしない。
        default: "60"

jobs:
  session:
    # reusable workflow を呼ぶ job だけが OIDC トークンを受け取る。
    permissions:
      id-token: write # Tailscale はランナーを OIDC で認証する
      contents: read
    # simtunnel にはリリースタグが無いため main の commit で固定する (macos-app-session.yml と同じ commit)。
    uses: bannzai/simtunnel/.github/workflows/session.yml@91d3333b22a3040b1739f5483e2fb957110aedac # main 2026-09-18
    with:
      session: ${{ inputs.session }}
      device: ${{ inputs.device }}
      duration_minutes: ${{ inputs.duration_minutes }}
      build_project: Tanzaku.xcodeproj
      build_scheme: TanzakuiOS
      # ランナーには署名 ID が無く、reusable workflow は署名のフラグを渡さないため、署名 ID の要らない Debug 構成を使う。
      # iOS のアプリと共有シートの拡張はこの構成で ad-hoc 署名する。署名しないと App Group の entitlement が入らず共有コンテナを開けないため (documents/DIRECTION.md「決めたこと」)。
      build_configuration: DebugUnsigned
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}

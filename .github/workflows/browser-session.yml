# GitHub Actions の Linux ランナーで Chromium を起動し、公開サイト (docs/。LP と法務ドキュメント) を
# ローカル Mac のブラウザを使わずに確認する。処理の本体は webtunnel の reusable workflow
# (https://github.com/bannzai/webtunnel 、PROJECT.md「dev サーバの起動」)。使い方: AGENTS.md「画面の確認」。
name: browser-session
# run-name は local/webtunnel CLI が run を特定するキーのためこの形式を維持する。
run-name: "session=${{ inputs.session }} duration=${{ inputs.duration_minutes }}m"

on:
  # fork からの pull request に Tailscale の Secrets を渡さないため、手動 dispatch だけにする。
  workflow_dispatch:
    # local/webtunnel は CLI のオプションを対応する input として送り、未宣言の input を含む dispatch は拒否されるため全て宣言する。
    inputs:
      session:
        required: true
        # tailnet のホスト名になるため、別リポジトリのセッションと衝突しないようリポジトリ名を接頭辞にする (AGENTS.md「画面の確認」)。
        default: tanzaku-web
      duration_minutes:
        required: true
        default: "60"
      start_url:
        required: false
        default: ""
      record:
        required: false
        default: "true"
      preview:
        required: false
        default: "true"
      setup_script:
        required: false
        default: ".webtunnel/setup.sh"
      software_webgl:
        required: false
        default: "false"

jobs:
  session:
    permissions:
      id-token: write # Tailscale はランナーを OIDC で認証する
      contents: read
    # webtunnel にはリリースタグが無いため main の commit で固定する。
    uses: bannzai/webtunnel/.github/workflows/session.yml@66a7d244332f605253c86c6ee0851f11980f5f01 # main 2026-09-11
    with:
      session: ${{ inputs.session }}
      duration_minutes: ${{ inputs.duration_minutes }}
      start_url: ${{ inputs.start_url }}
      record: ${{ inputs.record }}
      preview: ${{ inputs.preview }}
      setup_script: ${{ inputs.setup_script }}
      software_webgl: ${{ inputs.software_webgl }}
      # docs/ は GitHub Pages が Jekyll で配信する。法務ドキュメントの Markdown の HTML 化と拡張子なしの URL (/Terms-ja) を本番と同じに確かめるため、Jekyll で配信する。
      # docs/_config.yml の theme・plugins と揃える。
      setup_command: sudo gem install jekyll jekyll-theme-primer jekyll-optional-front-matter jekyll-default-layout jekyll-titles-from-headings --no-document
      # 127.0.0.1 に束縛しないと webtunnel の loopback 検証で失敗する。
      start_command: jekyll serve --source docs --destination "$RUNNER_TEMP/_site" --host 127.0.0.1 --port "$PORT"
      port: "8000"
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
